appId: com.changhong.valkyrie
productName: Valkyrie

directories:
  output: release

# 渲染层已由 Vite 打包，运行时只需要主进程、预加载脚本和渲染产物
files:
  - package.json
  - dist/renderer/**/*
  - src/main/**/*
  - src/preload/**/*

# 前端 + 数据层打进同一个安装包：精简 JRE 与数据层程序
extraResources:
  - from: ../server/target/valkyrie-server.jar
    to: server/valkyrie-server.jar
  - from: build/runtime
    to: runtime

asar: true

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Valkyrie
