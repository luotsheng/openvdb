<!DOCTYPE html>
<!--suppress ALL -->
<html>
<head>
    <meta charset="UTF-8">
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        /* 按住 Shortcut 键悬停在表名上时的超链接样式 */
        .vk-table-link {
            color: #007aff !important;
            text-decoration: underline;
            cursor: pointer;
        }

        /* 滚动条：圆角 + 主题蓝（!important 覆盖 Monaco 的内联颜色） */
        .monaco-scrollbar .slider {
            background-color: rgba(0, 122, 255, 0.40) !important;
            border-radius: 8px !important;
        }

        .monaco-scrollbar .slider:hover,
        .monaco-scrollbar .slider.active {
            background-color: rgba(0, 122, 255, 0.70) !important;
        }

        /* 强制中文使用系统中文无衬线字体，避免回退到日文/韩文字形 */
        .monaco-editor,
        .monaco-editor .view-lines,
        .monaco-editor .view-line,
        .monaco-editor .suggest-widget,
        .monaco-editor .monaco-list {
            font-family: "Menlo", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace !important;
        }
    </style>
</head>
<body>
<div id="container"></div>

<script>
    // 解决 WebView worker 问题（必须）
    self.MonacoEnvironment = {
        getWorker: function () {
            return new Worker(
                URL.createObjectURL(
                    new Blob(
                        ['self.onmessage=function(){}'],
                        { type: 'text/javascript' }
                    )
                )
            );
        }
    };
</script>

<script>
    var require = { paths: { vs: './vs' } };
</script>
<script src="./vs/loader.js"></script>

<script>
    window.Suggestions = [];

    window.addSuggestions = function (suggestions) {
        const start = performance.now();
        window.Suggestions = window.Suggestions = suggestions;
        const end = performance.now();
        console.log(`window#addSuggestions 耗时: ${end - start} ms`);
    }

    require(['vs/editor/editor.main'], function () {
        window.editor = monaco.editor.create(
            document.getElementById('container'), {
                value: '',
                language: 'sql',
                fontSize: 16,
                fontFamily: "Menlo, Monaco, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', monospace",
                automaticLayout: false,
                roundedSelection: false,
                mouseWheelScrollSensitivity: 0.03,
                scrollBeyondLastLine: false,
                scrollbar: {
                    useShadows: true,
                    verticalHasArrows: true,
                    horizontalHasArrows: true,
                    vertical: 'auto',
                    horizontal: 'auto',
                    verticalScrollbarSize: 17,
                    horizontalScrollbarSize: 17,
                    arrowSize: 30,
                    alwaysConsumeMouseWheel: false
                }
            }
        );

        /*
         * 代替 automaticLayout：拖动分割线时 resize 事件非常密集，
         * 用 requestAnimationFrame 把多次 resize 合并成每帧一次 layout，
         * 避免同步 layout 造成的拖动卡顿。
         */
        let editorLayoutScheduled = false;

        const scheduleEditorLayout = () => {
            if (editorLayoutScheduled)
                return;

            editorLayoutScheduled = true;

            requestAnimationFrame(() => {
                editorLayoutScheduled = false;
                editor.layout();
            });
        };

        new ResizeObserver(scheduleEditorLayout)
            .observe(document.getElementById('container'));

        window.addEventListener('resize', scheduleEditorLayout);

        monaco.languages.registerCompletionItemProvider('sql', {
            triggerCharacters: [' ', '.'],

            provideCompletionItems: function(model, position) {
                const word = model.getWordUntilPosition(position);

                const range = {
                    startLineNumber: position.lineNumber,
                    endLineNumber: position.lineNumber,
                    startColumn: word.startColumn,
                    endColumn: word.endColumn
                };

                let items = [];

                // 上下文感知补全：由 Java 端根据光标位置解析 FROM/JOIN 的表与别名
                try {
                    if (window.hook && window.hook.getSuggestions) {
                        const raw = window.hook.getSuggestions(
                            model.getValue(),
                            model.getOffsetAt(position)
                        );
                        items = JSON.parse(raw);
                    }
                } catch (e) {
                    items = [];
                }

                // 兜底：使用推送的全量提示
                if (!items || items.length === 0)
                    items = Array.from(window.Suggestions || []);

                const suggestions = items.map(item => {
                    let ret = {
                        label: item.label,
                        kind: getKind(item.kind),
                        insertText: item.insertText != null ? item.insertText : item.label,
                        detail: item.detail,
                        range: range
                    };

                    if (item.kind == 'Snippet') {
                        ret.insertTextRules =
                            monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet;
                    }

                    return ret;
                });

                function getKind(kind) {
                    const kinds = {
                        'Keyword': monaco.languages.CompletionItemKind.Function,
                        'Function': monaco.languages.CompletionItemKind.Function,
                        'Operator': monaco.languages.CompletionItemKind.Operator,
                        'Class': monaco.languages.CompletionItemKind.Class,
                        'Field': monaco.languages.CompletionItemKind.Field,
                        'Module': monaco.languages.CompletionItemKind.Module,
                        'Snippet': monaco.languages.CompletionItemKind.Snippet,
                    };
                    return kinds[kind] || monaco.languages.CompletionItemKind.Keyword;
                }

                return {
                    suggestions: suggestions
                };
            }
        });

        editor.onDidChangeModelContent((event) => {
            if (event.isFlush)
                return;

            window.hook.onDidChangeModelContent();
        });

        // 光标/选区变化上报（去抖，避免高频跨桥调用）
        let cursorReportTimer = null;
        editor.onDidChangeCursorSelection((event) => {
            if (cursorReportTimer)
                clearTimeout(cursorReportTimer);

            cursorReportTimer = setTimeout(() => {
                if (!window.hook)
                    return;

                const selection = event.selection;
                const selected = selection.isEmpty()
                    ? 0
                    : editor.getModel().getValueLengthInRange(selection);

                window.hook.onDidChangeCursorSelection(
                    selection.positionLineNumber,
                    selection.positionColumn,
                    selected
                );
            }, 50);
        });

        // 按住 Cmd/Ctrl 悬停时，表名显示为超链接样式并展示表注释
        let linkDecorations = [];
        let lastLinkWord = null;
        let lastLinkIsTable = false;

        const clearTableLink = () => {
            if (linkDecorations.length) {
                editor.deltaDecorations(linkDecorations, []);
                linkDecorations = [];
            }
        };

        const hideTableTooltip = () => {
            lastLinkWord = null;
            if (window.hook && window.hook.hideTableTooltip)
                window.hook.hideTableTooltip();
        };

        editor.onMouseMove((e) => {
            const browserEvent = e.event && e.event.browserEvent;
            const modifier = browserEvent && (browserEvent.metaKey || browserEvent.ctrlKey);
            const position = e.target && e.target.position;

            if (!modifier || !position) {
                clearTableLink();
                hideTableTooltip();
                return;
            }

            const model = editor.getModel();
            const word = model.getWordAtPosition(position);

            if (!word || !word.word) {
                clearTableLink();
                hideTableTooltip();
                return;
            }

            // 仅在标识符变化时询问 Java，避免频繁跨桥调用
            if (word.word !== lastLinkWord) {
                lastLinkWord = word.word;
                lastLinkIsTable = window.hook && window.hook.hoverTable
                    ? window.hook.hoverTable(
                        word.word, browserEvent.clientX, browserEvent.clientY)
                    : false;
            }

            if (!lastLinkIsTable) {
                clearTableLink();
                return;
            }

            linkDecorations = editor.deltaDecorations(linkDecorations, [{
                range: new monaco.Range(
                    position.lineNumber, word.startColumn,
                    position.lineNumber, word.endColumn
                ),
                options: { inlineClassName: 'vk-table-link' }
            }]);
        });

        // 松开 Cmd/Ctrl、失焦或移出编辑器时收起链接与提示
        document.addEventListener('keyup', (e) => {
            if (!e.metaKey && !e.ctrlKey) {
                clearTableLink();
                hideTableTooltip();
            }
        });

        window.addEventListener('blur', () => {
            clearTableLink();
            hideTableTooltip();
        });

        editor.onMouseLeave(() => {
            clearTableLink();
            hideTableTooltip();
        });

        // 按住 Cmd/Ctrl 点击标识符 → 交给 Java 判断是否为表名并跳转到设计表
        editor.onMouseDown((e) => {
            const browserEvent = e.event && e.event.browserEvent;
            const modifier = browserEvent && (browserEvent.metaKey || browserEvent.ctrlKey);
            const position = e.target && e.target.position;

            if (!modifier || !position)
                return;

            const model = editor.getModel();
            const word = model.getWordAtPosition(position);

            if (!word || !word.word)
                return;

            if (window.hook && window.hook.openTable)
                window.hook.openTable(word.word);
        });

        /**
         * Ctrl + W
         * 智能扩大选择
         */
        editor.addAction({
            id: 'smart-select-expand',
            label: 'Expand Selection',
            keybindings: [
                monaco.KeyMod.CtrlCmd |
                monaco.KeyCode.KeyW
            ],
            run: function (editor) {
                editor.trigger(
                    'keyboard',
                    'editor.action.smartSelect.expand',
                    {}
                );
            }
        });

        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyX, () => {
            const model = editor.getModel();
            const selection = editor.getSelection();

            let text;
            let range;

            if (selection.isEmpty()) {
                const line = selection.startLineNumber;
                text = model.getLineContent(line);

                if (line < model.getLineCount()) {
                    text += '\n';

                    range = new monaco.Range(
                        line,
                        1,
                        line + 1,
                        1
                    );
                } else {
                    range = new monaco.Range(
                        line,
                        1,
                        line,
                        model.getLineMaxColumn(line)
                    );
                }
            } else {
                text = model.getValueInRange(selection);
                range = selection;
            }

            if (range.isEmpty())
                return;

            editor.pushUndoStop();

            editor.executeEdits('', [{
                range: range,
                text: ''
            }]);

            editor.pushUndoStop();

            window.writeClipboard(text);
        });

        /**
         * Ctrl + Shift + W
         * 缩小选择
         */
        editor.addAction({
            id: 'smart-select-shrink',
            label: 'Shrink Selection',
            keybindings: [
                monaco.KeyMod.CtrlCmd |
                monaco.KeyMod.Shift |
                monaco.KeyCode.KeyW
            ],
            run: function (editor) {
                editor.trigger(
                    'keyboard',
                    'editor.action.smartSelect.shrink',
                    {}
                );
            }
        });

        /**
         * Alt + Shift + Up
         * 上方插入多光标
         */
        editor.addAction({
            id: 'insert-cursor-above',
            label: 'Insert Cursor Above',
            keybindings: [
                monaco.KeyMod.Alt | monaco.KeyMod.Shift |
                monaco.KeyCode.UpArrow
            ],
            run: function (editor) {
                editor.trigger(
                    'keyboard',
                    'editor.action.insertCursorAbove',
                    {}
                );
            }
        });

        /**
         * Alt + Shift + Down
         * 下方插入多光标
         */
        editor.addAction({
            id: 'insert-cursor-below',
            label: 'Insert Cursor Below',
            keybindings: [
                monaco.KeyMod.Alt | monaco.KeyMod.Shift |
                monaco.KeyCode.DownArrow
            ],
            run: function (editor) {
                editor.trigger(
                    'keyboard',
                    'editor.action.insertCursorBelow',
                    {}
                );
            }
        });

        /**
         * Ctrl + D
         * 复制一行
         */
        editor.addAction({
            id: 'duplicate-line',
            label: 'Duplicate Line',
            keybindings: [
                monaco.KeyMod.CtrlCmd |
                monaco.KeyCode.KeyD
            ],
            run: function(editor) {
                editor.trigger(
                    'keyboard',
                    'editor.action.copyLinesDownAction',
                    {}
                );
            }
        });

        /**
         * Ctrl + Shift + U
         * 大小写转换
         */
        editor.addAction({
            id: 'toggle-case',
            label: 'Toggle CASE',
            keybindings: [
                monaco.KeyMod.Shift |
                monaco.KeyMod.CtrlCmd |
                monaco.KeyCode.KeyU
            ],
            run: function (editor) {
                const selections = editor.getSelections();
                const edits = [];

                selections.forEach(sel => {
                    const text = editor.getModel().getValueInRange(sel);

                    if (!text)
                        return;

                    let newText;

                    const hasUpper = /[A-Z]/.test(text);
                    const hasLower = /[a-z]/.test(text);

                    if (hasUpper && !hasLower) {
                        newText = text.toLowerCase();
                    } else {
                        newText = text.toUpperCase();
                    }

                    edits.push({
                        range: sel,
                        text: newText
                    });
                });

                editor.executeEdits('toggle-case', edits);
            }
        });

        editor.layout();

        // 通知 Java 端编辑器已就绪（带有限次重试，等待 hook 安装完成）
        let readyTries = 0;
        (function notifyReady() {
            if (window.hook && window.hook.onEditorReady) {
                window.hook.onEditorReady();
                return;
            }
            if (++readyTries > 100)
                return;
            setTimeout(notifyReady, 30);
        })();
    });
</script>
</body>
</html>
